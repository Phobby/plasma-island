<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">Dynamic Island — Symbiot Black notch</title>
  <desc id="desc">Illustration of the default notch joined to the screen edge, with a slate border and a black-to-charcoal gradient. A larger open notch below shows media, a download and a timer.</desc>
  <defs>
    <linearGradient id="desktop" x2="1" y2="1"><stop stop-color="#303845"/><stop offset="1" stop-color="#11151c"/></linearGradient>
    <linearGradient id="symbiot" x2="0" y2="1"><stop stop-color="#292c30"/><stop offset=".5" stop-color="#202326"/><stop offset="1" stop-color="#0e1012"/></linearGradient>
  </defs>
  <rect width="1200" height="460" rx="18" fill="url(#desktop)"/>
  <g font-family="sans-serif" fill="#fcfcfc">
    <rect width="1200" height="36" fill="#202326"/>
    <text x="28" y="24" font-size="13" fill="#a1a9b1">Applications</text>
    <text x="1090" y="24" font-size="13" fill="#a1a9b1">KDE Plasma</text>
    <path d="M470 0H730V24Q730 42 712 42H488Q470 42 470 24Z" fill="url(#symbiot)"/>
    <path d="M470.5 0V24Q470.5 41.5 488 41.5H712Q729.5 41.5 729.5 24V0" fill="none" stroke="#4c566a" stroke-opacity=".7"/>
    <circle cx="502" cy="20" r="4" fill="#a1a9b1"/>
    <text x="600" y="26" text-anchor="middle" font-size="17" font-weight="600">09:41</text>
    <path d="M691 24V16M697 27V12M703 23V17" stroke="#a1a9b1" stroke-width="2" stroke-linecap="round"/>
    <text x="600" y="103" text-anchor="middle" font-size="14" letter-spacing="3" fill="#bbc2d2">DYNAMIC ISLAND · KDE PLASMA 6</text>
    <text x="600" y="151" text-anchor="middle" font-size="38" font-weight="600">Symbiot Black</text>
    <text x="600" y="182" text-anchor="middle" font-size="16" fill="#a1a9b1">A notch that belongs on your desktop.</text>
    <rect x="275" y="220" width="650" height="218" rx="12" fill="#16191d"/>
    <path d="M360 220H840V378Q840 402 816 402H384Q360 402 360 378Z" fill="url(#symbiot)"/>
    <path d="M360.5 220V378Q360.5 401.5 384 401.5H816Q839.5 401.5 839.5 378V220" stroke="#4c566a" stroke-opacity=".7" fill="none"/>
    <text x="386" y="253" font-size="12" fill="#a1a9b1">MEDIA</text>
    <text x="814" y="253" text-anchor="end" font-size="13">09:41</text>
    <rect x="386" y="269" width="54" height="54" rx="9" fill="#39414f"/>
    <text x="413" y="305" text-anchor="middle" font-size="30">♪</text>
    <text x="456" y="291" font-size="17" font-weight="600">Midnight Sessions</text>
    <text x="456" y="315" font-size="13" fill="#a1a9b1">Music, without leaving your flow</text>
    <path d="M386 342H814" stroke="#39414f"/>
    <circle cx="394" cy="367" r="7" fill="none" stroke="#a1a9b1" stroke-width="2"/>
    <text x="414" y="372" font-size="13">Download · 72%</text>
    <text x="814" y="372" text-anchor="end" font-size="13" fill="#a1a9b1">Timer · 04:32</text>
  </g>
</svg>
