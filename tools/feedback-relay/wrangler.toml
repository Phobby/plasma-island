# The island's feedback relay (worker.mjs), as Cloudflare's `wrangler` deploys it.
# The bot's token and the chat's id are secrets, not written here:
#   npx wrangler secret put BOT_TOKEN
#   npx wrangler secret put CHAT_ID
# See README.md beside this file.
name = "island-feedback"
main = "worker.mjs"            # relay.mjs beside it has the rules
compatibility_date = "2026-10-01"
# Only the workers.dev address; no preview addresses.
workers_dev = true
preview_urls = false

# Nothing is logged: the Worker writes no log, and Cloudflare's own log collection is off.
[observability]
enabled = false

# How many messages an hour (worker.mjs reads them; relay.mjs has the same as its defaults).
[vars]
PER_SENDER_HOURLY = "3"
TOTAL_HOURLY = "20"

# The counter of the last hour's messages, per sender and for everybody (FeedbackLimit in
# worker.mjs): a Durable Object, which counts exactly (also on the free plan).
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "FeedbackLimit"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["FeedbackLimit"]
